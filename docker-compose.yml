services:
  postgres:
    image: postgres:16-alpine
    container_name: chui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chui
      POSTGRES_PASSWORD: chui
      POSTGRES_DB: chui_loyalty
    ports:
      - "5432:5432"
    volumes:
      - chui_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chui-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - chui_redisdata:/data

volumes:
  chui_pgdata:
  chui_redisdata:
