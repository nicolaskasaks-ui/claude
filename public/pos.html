<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>POS · Chuí</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" />
    <style>
      :root {
        --bg: #EDEBE2;
        --bg-deep: #E5E2D6;
        --surface: #FFFFFF;
        --ink: #10281A;
        --ink-soft: #2C4030;
        --ink-on-dark: #EDEBE2;
        --muted: #7A7868;
        --line: #D4D0C0;
        --line-strong: rgba(16, 40, 26, 0.18);
        --error: #8B2E2E;
        --success: #2C5934;
        --serif: "Fraunces", "EB Garamond", Georgia, serif;
        --sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        font-feature-settings: "ss01", "cv11";
        -webkit-font-smoothing: antialiased;
        text-wrap: pretty;
      }
      h1, h2, h3 { font-family: var(--serif); text-wrap: balance; letter-spacing: -0.01em; }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
        font-weight: 500;
      }

      header.top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 32px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }
      header.top .left { display: flex; align-items: center; gap: 14px; }
      header.top .left img { height: 24px; }
      header.top .left .meta { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); border-left: 1px solid var(--line); padding-left: 14px; }
      header.top .who { font-size: 12px; color: var(--ink-soft); }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 32px 80px;
      }
      @media (max-width: 600px) {
        header.top { padding: 18px 20px; }
        main { padding: 24px 20px 60px; }
      }

      /* Login */
      .login-wrap { max-width: 440px; margin: 60px auto; }

      /* Cols */
      .grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 24px; }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line-strong);
        padding: 32px;
      }
      .panel h2 {
        font-size: 22px;
        font-weight: 500;
        margin: 0 0 4px;
      }
      .panel h3 {
        font-size: 13px;
        font-family: var(--sans);
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin: 26px 0 12px;
      }
      .panel-step {
        font-family: var(--sans);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
        font-weight: 500;
        margin-bottom: 8px;
      }

      label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin: 14px 0 6px;
        font-weight: 500;
      }
      input, select {
        width: 100%;
        padding: 14px 0;
        font-size: 17px;
        font-family: var(--sans);
        color: var(--ink);
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line-strong);
        outline: none;
        transition: border-color 0.18s ease;
        border-radius: 0;
      }
      input::placeholder { color: var(--muted); }
      input:focus, select:focus { border-bottom-color: var(--ink); }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 18px 24px;
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        border: 1px solid var(--ink);
        border-radius: 0;
        transition: background 0.18s ease, color 0.18s ease;
      }
      button.primary { background: var(--ink); color: var(--ink-on-dark); width: 100%; }
      button.primary:hover { background: var(--ink-soft); }
      button.secondary { background: transparent; color: var(--ink); width: 100%; }
      button.secondary:hover { background: var(--bg-deep); }
      button.scan {
        background: transparent;
        color: var(--ink);
        width: 100%;
        padding: 22px;
        font-size: 13px;
        letter-spacing: 0.16em;
      }
      button.scan:hover { background: var(--bg-deep); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }

      .or {
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 20px 0;
        position: relative;
      }
      .or::before, .or::after {
        content: "";
        position: absolute;
        top: 50%;
        width: calc(50% - 24px);
        height: 1px;
        background: var(--line);
      }
      .or::before { left: 0; }
      .or::after { right: 0; }

      .results {
        margin-top: 14px;
        max-height: 280px;
        overflow-y: auto;
        border-top: 1px solid var(--line);
      }
      .result-row {
        padding: 14px 4px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        transition: background 0.12s ease;
      }
      .result-row:hover { background: var(--bg-deep); padding-left: 8px; padding-right: 8px; }
      .result-row .name { font-weight: 500; font-size: 14px; }
      .result-row .contact { font-size: 12px; color: var(--muted); margin-top: 2px; }

      /* Selected card display */
      .selected {
        background: var(--ink);
        color: var(--ink-on-dark);
        padding: 28px 28px 22px;
        margin-bottom: 18px;
        position: relative;
        overflow: hidden;
      }
      .selected.gift { background: linear-gradient(180deg, var(--ink) 0%, #1A3D2A 100%); }
      .selected .name {
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 500;
        line-height: 1.15;
      }
      .selected .contact { font-size: 12px; opacity: 0.7; margin-top: 4px; }
      .selected .tier-pill {
        display: inline-block;
        padding: 4px 10px;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 500;
        background: var(--bg);
        color: var(--ink);
      }
      .selected .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 8px 0;
        border-top: 1px solid rgba(237,235,226,0.15);
        margin-top: 16px;
      }
      .selected .stat-row .k { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.65; font-weight: 500; }
      .selected .stat-row .v { font-family: var(--serif); font-size: 22px; font-weight: 500; }
      .selected .header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 12px; }

      .receipt {
        background: var(--bg-deep);
        border: 1px solid var(--line);
        padding: 18px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 13px;
        line-height: 1.55;
        white-space: pre-wrap;
        margin-top: 18px;
      }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 22px;
        background: var(--ink);
        color: var(--ink-on-dark);
        font-size: 13px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
        z-index: 1000;
        border: 1px solid var(--ink);
      }
      .toast.show { opacity: 1; }
      .toast.error { background: var(--error); border-color: var(--error); }
      .toast.success { background: var(--success); border-color: var(--success); }

      /* Scanner overlay */
      .scanner {
        position: fixed;
        inset: 0;
        background: rgba(16,40,26,0.96);
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 32px;
      }
      .scanner.active { display: flex; }
      .scanner-frame {
        position: relative;
        width: min(86vw, 460px);
        aspect-ratio: 1;
        overflow: hidden;
        border: 1px solid rgba(237,235,226,0.3);
      }
      .scanner-frame video { width: 100%; height: 100%; object-fit: cover; }
      .scanner-overlay {
        position: absolute;
        inset: 14%;
        border: 1px solid var(--ink-on-dark);
        pointer-events: none;
      }
      .scanner-hint {
        color: var(--ink-on-dark);
        margin-top: 24px;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      .scanner-close {
        margin-top: 28px;
        background: transparent;
        color: var(--ink-on-dark);
        border: 1px solid rgba(237,235,226,0.4);
        padding: 14px 28px;
        font-size: 11px;
        letter-spacing: 0.18em;
      }
      .scanner-close:hover { background: rgba(237,235,226,0.08); }

      .row { display: flex; gap: 12px; }
      .row > * { flex: 1; }

      .err { color: var(--error); font-size: 13px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="left">
        <img src="/app/assets/logo-chui-dark.png" alt="Chuí" />
        <span class="meta">POS</span>
      </div>
      <div class="who" id="who"></div>
    </header>

    <main>
      <!-- LOGIN -->
      <section class="panel login-wrap" id="loginPanel">
        <div class="eyebrow" style="margin-bottom: 6px">Cajero</div>
        <h2 style="font-size: 28px; margin-bottom: 24px">Ingresar</h2>
        <label for="tenantSlug">Tenant</label>
        <input id="tenantSlug" value="chui" />
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" />
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" />
        <div style="margin-top: 28px"><button class="primary" id="loginBtn">Entrar</button></div>
      </section>

      <!-- WORK AREA -->
      <div class="grid">
        <section class="panel" id="searchPanel" style="display:none">
          <div class="panel-step">Paso 01</div>
          <h2>Identificar pase</h2>
          <p style="font-size:13px;color:var(--muted);margin:6px 0 22px">Escaneá el QR de la tarjeta del cliente, o buscá manualmente.</p>
          <button class="scan" id="scanBtn">Escanear QR</button>
          <div class="or">o</div>
          <input id="search" placeholder="Buscar por email, teléfono o nombre" />
          <div class="results" id="results"></div>
        </section>

        <section class="panel" id="salePanel" style="display:none">
          <div class="panel-step">Paso 02</div>
          <h2>Venta</h2>
          <div id="selected" style="margin-top: 22px"></div>

          <div id="loyaltyActions" style="display:none">
            <h3>Acreditar puntos</h3>
            <label for="amount">Total de la venta</label>
            <input id="amount" type="number" step="0.01" min="0" placeholder="0.00" />
            <div style="margin-top: 14px"><button class="primary" id="earnBtn">Acreditar</button></div>

            <h3>Canjear premio</h3>
            <label for="rewardSelect">Premio</label>
            <select id="rewardSelect"></select>
            <div style="margin-top: 14px"><button class="secondary" id="redeemBtn">Canjear</button></div>
          </div>

          <div id="giftActions" style="display:none">
            <h3>Cobrar con gift card</h3>
            <label for="giftAmount">Total de la venta</label>
            <input id="giftAmount" type="number" step="0.01" min="0" placeholder="0.00" />
            <div style="margin-top: 14px"><button class="primary" id="giftPayBtn">Debitar gift card</button></div>
          </div>

          <div id="receipt"></div>
        </section>
      </div>
    </main>

    <div class="scanner" id="scanner">
      <div class="scanner-frame">
        <video id="video" autoplay muted playsinline></video>
        <div class="scanner-overlay"></div>
      </div>
      <div class="scanner-hint">Apuntá la cámara al QR</div>
      <button class="scanner-close" id="scannerCloseBtn">Cancelar</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const state = {
        token: null, tenantId: null, tenantSlug: null,
        kind: null, customer: null, card: null, giftCard: null,
        scanStream: null, scanRaf: null,
      };

      function toast(msg, type) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "toast show " + (type || "");
        setTimeout(() => (el.className = "toast"), 2500);
      }

      function api(path, init) {
        init = init || {};
        init.headers = Object.assign(
          { "Content-Type": "application/json" },
          init.headers || {},
          state.token ? { Authorization: "Bearer " + state.token } : {},
        );
        return fetch(path, init).then(async (r) => {
          if (!r.ok) {
            const data = await r.json().catch(() => ({}));
            throw new Error(data.message || data.error || ("HTTP " + r.status));
          }
          return r.json();
        });
      }

      function uuid() { return crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random(); }
      function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

      // ---------- LOGIN ----------
      async function login() {
        try {
          const tenantSlug = document.getElementById("tenantSlug").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const res = await api("/v1/auth/staff/login", { method: "POST", body: JSON.stringify({ tenantSlug, email, password }) });
          state.token = res.token;
          state.tenantId = res.tenantId;
          state.tenantSlug = tenantSlug;
          document.getElementById("loginPanel").style.display = "none";
          document.getElementById("searchPanel").style.display = "block";
          document.getElementById("salePanel").style.display = "block";
          document.getElementById("who").textContent = email + " · " + res.role;
          loadRewards();
          toast("Bienvenido", "success");
        } catch (e) { toast(e.message, "error"); }
      }

      async function loadRewards() {
        const list = await api("/v1/rewards");
        const sel = document.getElementById("rewardSelect");
        sel.innerHTML = "";
        for (const r of list) {
          const opt = document.createElement("option");
          opt.value = r.id;
          opt.textContent = r.name + " — " + r.pointsCost + " pts";
          sel.appendChild(opt);
        }
      }

      // ---------- SEARCH ----------
      let searchDebounce;
      document.addEventListener("input", (e) => {
        if (e.target && e.target.id === "search") {
          clearTimeout(searchDebounce);
          const q = e.target.value;
          searchDebounce = setTimeout(() => doSearch(q), 200);
        }
      });
      async function doSearch(q) {
        const el = document.getElementById("results");
        if (!q) { el.innerHTML = ""; return; }
        const list = await api("/v1/customers?q=" + encodeURIComponent(q));
        el.innerHTML = "";
        for (const c of list) {
          const row = document.createElement("div");
          row.className = "result-row";
          row.innerHTML = `<div><div class="name">${escapeHtml([c.firstName, c.lastName].filter(Boolean).join(" ") || "—")}</div><div class="contact">${escapeHtml(c.email || "")} ${escapeHtml(c.phone || "")}</div></div>`;
          row.onclick = () => selectLoyaltyCustomer(c.id);
          el.appendChild(row);
        }
      }

      // ---------- QR SCANNER ----------
      async function openScanner() {
        const scanner = document.getElementById("scanner");
        const video = document.getElementById("video");
        try {
          state.scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        } catch (e) { toast("No pudimos acceder a la cámara", "error"); return; }
        video.srcObject = state.scanStream;
        scanner.classList.add("active");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const tick = () => {
          if (!scanner.classList.contains("active")) return;
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
            if (code && code.data) { closeScanner(); onScanned(code.data.trim()); return; }
          }
          state.scanRaf = requestAnimationFrame(tick);
        };
        state.scanRaf = requestAnimationFrame(tick);
      }
      function closeScanner() {
        const scanner = document.getElementById("scanner");
        scanner.classList.remove("active");
        if (state.scanRaf) cancelAnimationFrame(state.scanRaf);
        if (state.scanStream) { state.scanStream.getTracks().forEach((t) => t.stop()); state.scanStream = null; }
      }
      async function onScanned(serial) {
        try {
          const res = await api("/v1/lookup/by-serial?serial=" + encodeURIComponent(serial));
          if (res.kind === "loyalty") renderLoyalty(res.card);
          else if (res.kind === "gift") renderGift(res.giftCard);
        } catch (e) { toast(e.message, "error"); }
      }

      // ---------- LOYALTY ----------
      async function selectLoyaltyCustomer(id) {
        const c = await api("/v1/customers/" + id);
        const card = c.cards && c.cards[0];
        if (!card) { toast("Este cliente no tiene tarjeta activa", "error"); return; }
        state.customer = c;
        renderLoyalty(card, c);
      }
      function renderLoyalty(card, customer) {
        state.kind = "loyalty";
        state.card = card;
        state.giftCard = null;
        if (customer) state.customer = customer;
        const c = state.customer || card.customer || {};
        const sel = document.getElementById("selected");
        sel.className = "selected";
        sel.innerHTML = `
          <div class="header-row">
            <div>
              <div class="name">${escapeHtml([c.firstName, c.lastName].filter(Boolean).join(" ") || "Cliente")}</div>
              <div class="contact">${escapeHtml(c.email || c.phone || "")}</div>
            </div>
            <span class="tier-pill">${escapeHtml(card.tier?.name || "")}</span>
          </div>
          <div class="stat-row"><span class="k">Puntos</span><span class="v">${card.pointsBalance}</span></div>
          <div class="stat-row"><span class="k">Descuento del nivel</span><span class="v">${card.tier?.discountPct || 0}%</span></div>
        `;
        document.getElementById("loyaltyActions").style.display = "block";
        document.getElementById("giftActions").style.display = "none";
      }
      function renderGift(gc) {
        state.kind = "gift";
        state.giftCard = gc;
        state.card = null;
        state.customer = null;
        const sel = document.getElementById("selected");
        sel.className = "selected gift";
        const balance = (gc.balance / 100).toFixed(2);
        sel.innerHTML = `
          <div class="header-row">
            <div>
              <div class="contact" style="margin-bottom:4px">Gift card</div>
              <div class="name">${escapeHtml(gc.code)}</div>
            </div>
          </div>
          <div class="stat-row"><span class="k">Saldo disponible</span><span class="v">$${balance}</span></div>
        `;
        document.getElementById("loyaltyActions").style.display = "none";
        document.getElementById("giftActions").style.display = "block";
      }

      // ---------- ACTIONS ----------
      document.getElementById("loginBtn").onclick = login;
      document.getElementById("scanBtn").onclick = openScanner;
      document.getElementById("scannerCloseBtn").onclick = closeScanner;

      document.getElementById("earnBtn").onclick = async () => {
        if (!state.card) return toast("Identificá un cliente primero", "error");
        const dollars = parseFloat(document.getElementById("amount").value);
        if (!dollars || dollars <= 0) return toast("Ingresá un monto", "error");
        try {
          const tx = await api("/v1/cards/" + state.card.id + "/earn", { method: "POST", body: JSON.stringify({ amountCents: Math.round(dollars * 100), idempotencyKey: uuid() }) });
          document.getElementById("receipt").innerHTML = `<div class="receipt">Venta acreditada\nPuntos sumados: ${tx.pointsDelta}\nMonto: $${dollars.toFixed(2)}</div>`;
          toast("+" + tx.pointsDelta + " puntos", "success");
          const refreshed = await api("/v1/lookup/by-serial?serial=" + encodeURIComponent(state.card.nfcSerial));
          if (refreshed.kind === "loyalty") renderLoyalty(refreshed.card);
        } catch (e) { toast(e.message, "error"); }
      };

      document.getElementById("redeemBtn").onclick = async () => {
        if (!state.card) return toast("Identificá un cliente primero", "error");
        const rewardId = document.getElementById("rewardSelect").value;
        if (!rewardId) return toast("Seleccioná un premio", "error");
        try {
          await api("/v1/cards/" + state.card.id + "/redeem", { method: "POST", body: JSON.stringify({ rewardId, idempotencyKey: uuid() }) });
          toast("Premio canjeado", "success");
          const refreshed = await api("/v1/lookup/by-serial?serial=" + encodeURIComponent(state.card.nfcSerial));
          if (refreshed.kind === "loyalty") renderLoyalty(refreshed.card);
        } catch (e) { toast(e.message, "error"); }
      };

      document.getElementById("giftPayBtn").onclick = async () => {
        if (!state.giftCard) return toast("Escaneá una gift card", "error");
        const dollars = parseFloat(document.getElementById("giftAmount").value);
        if (!dollars || dollars <= 0) return toast("Ingresá un monto", "error");
        const cents = Math.round(dollars * 100);
        const debit = Math.min(cents, state.giftCard.balance);
        try {
          await api("/v1/gift-cards/" + state.giftCard.id + "/redeem", { method: "POST", body: JSON.stringify({ amountCents: debit, idempotencyKey: uuid() }) });
          const remaining = cents - debit;
          document.getElementById("receipt").innerHTML = `<div class="receipt">Total: $${dollars.toFixed(2)}\nPagado con gift: $${(debit / 100).toFixed(2)}\n${remaining > 0 ? "Falta cobrar: $" + (remaining / 100).toFixed(2) : "Venta cubierta totalmente."}</div>`;
          toast("Gift card debitada", "success");
          const refreshed = await api("/v1/lookup/by-serial?serial=" + encodeURIComponent(state.giftCard.nfcSerial));
          if (refreshed.kind === "gift") renderGift(refreshed.giftCard);
        } catch (e) { toast(e.message, "error"); }
      };
    </script>
  </body>
</html>
